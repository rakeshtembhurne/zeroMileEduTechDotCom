# Static site — no build step. Netlify serves the repo root directly.
[build]
  publish = "."

# Basic security headers for all responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Canonical domain is the apex: redirect www -> non-www.
[[redirects]]
  from = "https://www.zemet.org/*"
  to = "https://zemet.org/:splat"
  status = 301
  force = true
